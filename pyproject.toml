
[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-swarm"
version = "0.1.0"
description = "A multi-agent problem-solving and computation framework"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Kandarpa" }
]

dependencies = [
    # Core
    "python-dotenv==1.1.1",
    "pydantic==2.12.3",
    "PyYAML>=6.0,<7",

    # Agent framework / LLM
    "openai-agents==0.9.2",
    "ollama==0.6.0",

    # API server
    "fastapi==0.118.0",
    "uvicorn[standard]==0.37.0",

    # Scientific computing
    "numpy==2.3.3",
    "scipy==1.16.2",
    "pandas==2.3.3",

    # JAX
    "jax==0.7.2",
    "jaxlib==0.7.2",

    # HTTP / networking
    "httpx==0.28.1",

    # Utilities
    "tenacity==9.1.2",
    "loguru==0.7.3",
    "rich==14.1.0",
]

[project.scripts]
compute_agent = "agent_swarm.cli:main"
